name: Sync calendar

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ICS feed
        run: |
          curl -fsSL --retry 3 \
            'https://calendar.google.com/calendar/ical/06093b94873d5bcca7b4acaebde9cd8b7e8f40822f3dce5a3eccfdf84d162930%40group.calendar.google.com/public/basic.ics' \
            -o calendar/events.ics.new
          grep -q 'BEGIN:VCALENDAR' calendar/events.ics.new
          mv calendar/events.ics.new calendar/events.ics
      - name: Commit if changed
        run: |
          git diff --quiet calendar/events.ics && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add calendar/events.ics
          git commit -m 'Sync calendar feed'
          git push
