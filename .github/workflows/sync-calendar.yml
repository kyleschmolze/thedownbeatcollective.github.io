name: Sync calendar

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ICS feeds
        run: |
          fetch() {
            curl -fsSL --retry 3 "$1" -o "$2.tmp"
            grep -q 'BEGIN:VCALENDAR' "$2.tmp"
            mv "$2.tmp" "$2"
            # Strip per-fetch noise (DTSTAMP, SEQUENCE) and sort events so unchanged feeds produce no commit
            python3 .github/scripts/normalize_ics.py "$2"
          }
          fetch 'https://calendar.google.com/calendar/ical/06093b94873d5bcca7b4acaebde9cd8b7e8f40822f3dce5a3eccfdf84d162930%40group.calendar.google.com/public/basic.ics' calendar/events.ics
          fetch 'https://api.luma.com/ics/get?entity=calendar&id=cal-tmZVAT6bkyIXJMn' calendar/luma.ics
      - name: Fetch Luma cover images
        run: python3 .github/scripts/luma_images.py
      - name: Commit if changed
        run: |
          git add calendar/events.ics calendar/luma.ics calendar/luma-images.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync calendar feeds'
          git push
